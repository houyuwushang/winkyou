name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go vet ./...
        run: go vet ./...

      - name: Run go test ./...
        run: go test ./... -count=1

      - name: Run core race tests
        run: go test -race ./pkg/session ./pkg/client ./pkg/solver/... -count=1

      - name: Run N2c governed-adapter race tests
        run: >-
          go test -race
          ./internal/v2/rendezvouscarrier
          ./internal/stunobserve
          ./internal/probeio
          ./internal/governor
          ./internal/architecture
          ./internal/v2/directattempt
          -count=1

      - name: Run N2c mutation and stability matrix
        run: >-
          go test -race
          ./internal/v2/rendezvouscarrier
          ./internal/stunobserve
          ./internal/probeio
          ./internal/governor
          ./internal/architecture
          ./internal/v2/directattempt
          -run 'N2C|N2D|SameSocket|Reservation|EnforcedCost|InspectFrame|ExclusiveClaim'
          -count=20

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run go test ./...
        run: go test ./... -count=1

  loopback-connect-proof:
    name: Loopback Connect Proof (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run bounded loopback-only proof
        shell: pwsh
        run: ./scripts/verify-loopback-connect.ps1

  n1-netns-unicast-proof:
    name: N1 Netns Unicast Proof (required)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install isolated-network witness tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables conntrack
          command -v ip
          command -v iptables
          command -v ss
          command -v conntrack

      - name: Build race-enabled N1 integration binary
        run: go test -race -c -tags=natlab -o "${RUNNER_TEMP}/winkyou-n1.test" ./test/natlab

      - name: Run mandatory isolated N1 matrix
        run: >-
          sudo env WINKYOU_N1_REQUIRED=1 GORACE=halt_on_error=1
          "${RUNNER_TEMP}/winkyou-n1.test"
          -test.v
          -test.run '^TestLinuxN1UnicastProof$'
          -test.count=1
          -test.timeout=4m

  n2d-netns-nat-proof:
    name: N2d/N3b Netns NAT E2E Proof (required)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install isolated-network witness tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables conntrack
          command -v ip
          command -v iptables
          command -v iptables-restore
          command -v ss
          command -v conntrack
          command -v sysctl

      - name: Vet natlab-tagged code
        run: >-
          go vet -tags=natlab
          ./internal/governor
          ./internal/solverstdio
          ./internal/v2/directconnect
          ./internal/v2/rendezvouscarrier
          ./test/natlab

      - name: Build race-enabled N2d/N3b integration binary
        run: go test -race -c -tags=natlab -o "${RUNNER_TEMP}/winkyou-n2d.test" ./test/natlab

      - name: Run mandatory isolated N2d/N3b matrix
        run: >-
          sudo env WINKYOU_N2D_REQUIRED=1 GORACE=halt_on_error=1
          "${RUNNER_TEMP}/winkyou-n2d.test"
          -test.v
          -test.run '^TestLinuxN2DEndToEndProof$'
          -test.count=1
          -test.timeout=5m

  gate-a-netns-handoff-proof:
    name: Gate A OOB Handoff Netns Proof (required)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install isolated-network witness tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables conntrack
          command -v ip
          command -v iptables
          command -v iptables-restore
          command -v ss
          command -v conntrack
          command -v sysctl
          command -v tc

      - name: Vet Gate A natlab-tagged code
        run: >-
          go vet -tags=natlab
          ./internal/governor
          ./internal/v2/directconnect/gatea
          ./test/natlab

      - name: Build race-enabled Gate A integration binary
        run: go test -race -c -tags=natlab -o "${RUNNER_TEMP}/winkyou-gatea.test" ./test/natlab

      - name: Run mandatory isolated Gate A matrix
        run: >-
          sudo env WINKYOU_GATE_A_REQUIRED=1 GORACE=halt_on_error=1
          "${RUNNER_TEMP}/winkyou-gatea.test"
          -test.v
          -test.run '^TestLinuxGateAOOBHandoffProof$'
          -test.count=1
          -test.timeout=5m

  gate-b2-netns-hard-nat-proof:
    name: Gate B2 Hard NAT Netns Proof (required)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install isolated-network witness tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables conntrack
          sudo modprobe tun || true
          command -v ip
          command -v iptables
          command -v iptables-restore
          command -v ss
          command -v conntrack
          command -v sysctl
          command -v tc
          test -c /dev/net/tun

      - name: Vet Gate B2 natlab-tagged code
        run: >-
          go vet -tags=natlab
          ./internal/governor
          ./internal/probeio
          ./internal/v2/hardnatattempt
          ./internal/v2/hardnatbudget
          ./internal/v2/hardnatcontrol
          ./internal/v2/hardnatobserve
          ./internal/v2/hardnatplan
          ./internal/v2/directconnect/gateb
          ./test/natlab

      - name: Build race-enabled Gate B2 integration binary
        run: go test -race -c -tags=natlab -o "${RUNNER_TEMP}/winkyou-gateb2.test" ./test/natlab

      - name: Run mandatory isolated Gate B2 matrix
        run: >-
          sudo env WINKYOU_GATE_B2_REQUIRED=1 GORACE=halt_on_error=1
          "${RUNNER_TEMP}/winkyou-gateb2.test"
          -test.v
          -test.run '^TestLinuxGateB2HardNATProof$'
          -test.count=1
          -test.timeout=5m

  gate-b3-netns-hard16-proof:
    name: Gate B3 Hard16 Netns Load Proof (required)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install isolated-network witness tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables conntrack
          sudo modprobe tun || true
          command -v ip
          command -v iptables
          command -v iptables-restore
          command -v ss
          command -v conntrack
          command -v sysctl
          command -v tc
          command -v flock
          command -v readlink
          command -v setsid
          test -c /dev/net/tun

      - name: Vet Gate B3 natlab-tagged code
        run: >-
          go vet -tags=natlab
          ./internal/governor
          ./internal/natsim
          ./internal/probeio
          ./internal/architecture
          ./internal/v2/hardnatattempt
          ./internal/v2/hardnatbudget
          ./internal/v2/hardnatcontrol
          ./internal/v2/hardnatobserve
          ./internal/v2/hardnatplan
          ./internal/v2/directconnect/gateb
          ./test/natlab

      - name: Build race-enabled Gate B3 integration binary
        run: go test -race -c -tags=natlab -o "${RUNNER_TEMP}/winkyou-gateb3.test" ./test/natlab

      - name: Run mandatory isolated Gate B3 load and teardown matrix
        run: |
          sudo env \
            WINKYOU_GATE_B3_REQUIRED=1 \
            WINKYOU_GATE_B3_DISPOSABLE_RUNNER=github-hosted \
            GITHUB_ACTIONS=true \
            RUNNER_ENVIRONMENT=github-hosted \
            bash test/natlab/run_gate_b3_required_linux.sh \
            env GORACE=halt_on_error=1 \
            "${RUNNER_TEMP}/winkyou-gateb3.test" \
            -test.v \
            -test.run '^TestLinuxGateB3Hard16Proof$' \
            -test.count=1 \
            -test.timeout=9m

  gate-b3-natsim-repeat-proof:
    name: Gate B3 Fresh NATSim Campaign Proof (required)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run 100 fresh full-shape natsim campaigns
        run: >-
          WINKYOU_GATE_B3_REPEAT_REQUIRED=1
          go test ./internal/governor
          -run '^TestGateB3Hard16NATSimFreshTopology100$'
          -v
          -count=1
          -parallel=4
          -timeout=8m

  gate-b3-ledger-restart-proof:
    name: Gate B3 Campaign Ledger Restart Proof (required)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run 1000 crash-style campaign ledger restarts
        run: >-
          WINKYOU_GATE_B3_LEDGER_REQUIRED=1
          go test ./internal/governor
          -run '^TestHardNATCampaignSameCredential1000ProcessRestarts$'
          -v
          -count=1
          -timeout=8m

  gate-c1b-memory-pipeline:
    name: Gate C1b Memory CLI Pipeline (${{ matrix.os }}, required)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      GORACE: halt_on_error=1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet the tagged CLI and isolated process seams
        run: >-
          go vet -tags=c1bproof
          ./cmd/wink/cmd ./internal/governor ./internal/probeio
          ./internal/v2/gatecorchestrator ./internal/v2/gatecstage
          ./internal/v2/sshassembly ./internal/v2/hardnatcontrol

      - name: Prove the untagged capability boundary and mutations
        run: go test ./internal/architecture -run 'GateC1b' -count=1

      - name: Repeat the governed handoff and actual CLI pipelines with race detection
        run: >-
          go test -race -tags=c1bproof ./internal/governor
          -run '^TestGateC1b(MemoryProductPipelineReachesPostOOBEcho|MemoryCLIAndClaimedChildPipeline|GateBProductHandoffRetainsOwnershipUntilFinish)$'
          -count=20 -timeout=12m

      - name: Repeat consumer readiness, shared cap, cancellation and session tests
        run: >-
          go test -race ./internal/probeio ./internal/v2/hardnatcontrol ./internal/v2/gatecorchestrator
          -run 'WireGuard|ConsumerReady|ConsumerFinished|Foreground|CanceledInner|PostOOB|Conflict'
          -count=20 -timeout=3m

      - name: Prove 100 fresh CLI and durable-slot lifecycles
        env:
          WINKYOU_GATE_C1B_REPEAT_REQUIRED: "1"
        run: >-
          go test -tags=c1bproof ./internal/governor
          -run '^TestGateC1bMemoryProductPipelineFresh100$'
          -v -count=1 -timeout=9m

  gate-c1b-netns-product-proof:
    name: Gate C1b Product Pipeline Netns Proof (required)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify SSH tools and install isolated-network witness tools
        run: |
          # Do not install, start, reconfigure, or reuse the host SSH service.
          # Each test runs its own sshd in private mount/network namespaces.
          test -x /usr/bin/ssh || { echo 'required SSH client absent'; exit 1; }
          test -d /usr/libexec || { echo 'required installation mountpoint absent'; exit 1; }
          sudo apt-get update
          sudo apt-get install -y iproute2 iptables conntrack
          if test -x /usr/sbin/sshd; then
            echo 'WINKYOU_C1B_SSHD_BINARY=/usr/sbin/sshd' >> "$GITHUB_ENV"
          else
            c1b_tools="$(mktemp -d "${RUNNER_TEMP}/c1b-sshd.XXXXXX")"
            (
              cd "$c1b_tools"
              apt-get download openssh-server
              dpkg-deb --extract openssh-server_*.deb extracted
            )
            test -x "$c1b_tools/extracted/usr/sbin/sshd"
            echo "WINKYOU_C1B_SSHD_BINARY=$c1b_tools/extracted/usr/sbin/sshd" >> "$GITHUB_ENV"
          fi
          sudo modprobe tun || true
          command -v ip
          command -v iptables
          command -v ss
          command -v conntrack
          command -v flock
          command -v readlink
          command -v setsid
          test -c /dev/net/tun

      - name: Vet the exact isolated C1b composition
        run: >-
          go vet -tags=natlab,c1bproof
          ./internal/governor ./internal/probeio ./internal/architecture
          ./internal/v2/gatecorchestrator ./internal/v2/sshchildwrapper
          ./cmd/wink/cmd ./test/natlab

      - name: Build race-enabled product composition proof
        run: go test -race -c -tags=natlab,c1bproof -o "${RUNNER_TEMP}/winkyou-gatec1b.test" ./test/natlab

      - name: Reject native bind and ordinary constructor escape in the isolated TUN bridge
        run: go test -race -tags=natlab,c1bproof ./pkg/tunnel -run '^TestGateCNATLabConstructorKeepsNativeBindDisabled$' -count=20

      - name: Prove real root SSH child and TEST-NET-only UDP composition
        run: |
          sudo env \
            WINKYOU_GATE_C1B_REQUIRED=1 \
            WINKYOU_C1B_SSHD_BINARY="$WINKYOU_C1B_SSHD_BINARY" \
            WINKYOU_GATE_B3_REQUIRED=1 \
            WINKYOU_GATE_B3_DISPOSABLE_RUNNER=github-hosted \
            GITHUB_ACTIONS=true \
            RUNNER_ENVIRONMENT=github-hosted \
            bash test/natlab/run_gate_b3_required_linux.sh \
            env GORACE=halt_on_error=1 \
            "${RUNNER_TEMP}/winkyou-gatec1b.test" \
            -test.v \
            -test.run '^(TestGateC1bSSHDiagnosticsAreBoundedAndRedacted|TestLinuxGateC1bProductProof)$' \
            -test.count=1 \
            -test.timeout=12m

  relay-smoke-linux:
    name: Relay Smoke (Linux)
    needs: test-linux
    runs-on: ubuntu-latest
    env:
      WINKYOU_FORCE_RELAY: "1"
      WINKYOU_NETIF_ALLOW_MEMORY: "1"
      WINKYOU_TUNNEL_ALLOW_MEMORY: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run relay wggo smoke
        run: go test ./pkg/client -run TestRelayWGGoTwoEnginesExchangeIPv4Packets -count=3
