name: C1c Router Composition Proof

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  router-composition:
    name: C1c Router Three Instances (required)
    runs-on: ubuntu-latest
    # ceil((63 prep + 56 symbols + 46 two builds + 35 focused race +
    #       420 isolated matrix + 60 guardian crash) * 1.25 / 60) = 15.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Prepare isolated witness tools
        run: |
          test -x /usr/bin/ssh
          test -d /usr/libexec
          sudo apt-get update -qq
          sudo apt-get install -y -qq iproute2 iptables nftables conntrack iputils-ping
          if test -x /usr/sbin/sshd; then
            echo 'WINKYOU_C1B_SSHD_BINARY=/usr/sbin/sshd' >> "$GITHUB_ENV"
          else
            router_tools="$(mktemp -d "${RUNNER_TEMP}/router-sshd.XXXXXX")"
            (
              cd "$router_tools"
              apt-get download openssh-server
              dpkg-deb --extract openssh-server_*.deb extracted
            )
            test -x "$router_tools/extracted/usr/sbin/sshd"
            echo "WINKYOU_C1B_SSHD_BINARY=$router_tools/extracted/usr/sbin/sshd" >> "$GITHUB_ENV"
          fi
          sudo modprobe tun || true
          test -c /dev/net/tun
      - name: Validate field boundaries and pure tool contracts
        run: |
          go vet -tags=fieldc1c,natlab,c1bproof ./...
          go test -race -tags=fieldc1c ./internal/c1crouter ./internal/v2/fieldc1c -count=20 -failfast
          go test ./internal/architecture -run '^TestC1cRouter' -count=20 -failfast
      - name: Build exact images and prove ordinary exclusion
        run: |
          router_sha="$(git rev-parse HEAD)"
          go build -buildvcs=true -o "${RUNNER_TEMP}/wink-ordinary" ./cmd/wink
          go tool nm "${RUNNER_TEMP}/wink-ordinary" > "${RUNNER_TEMP}/ordinary-symbols"
          if grep -E 'winkyou/internal/(c1crouter|v2/fieldc1c)\.' "${RUNNER_TEMP}/ordinary-symbols"; then
            echo 'ordinary router symbol leak'
            exit 1
          fi
          go build -race -buildvcs=true -tags=fieldc1c -ldflags "-X winkyou/internal/v2/fieldc1c.BuildSHA=${router_sha}" -o "${RUNNER_TEMP}/wink-field" ./cmd/wink
          go build -race -buildvcs=true -tags=fieldc1c -ldflags "-X winkyou/internal/v2/fieldc1c.BuildSHA=${router_sha}" -o "${RUNNER_TEMP}/c1crouter" ./cmd/c1crouter
          go tool nm "${RUNNER_TEMP}/c1crouter" > "${RUNNER_TEMP}/router-symbols"
          grep -q 'winkyou/internal/c1crouter.runGuardian' "${RUNNER_TEMP}/router-symbols"
          # The exported one-line wrapper may be inlined; the validating
          # implementation must remain reachable in the optimized field image.
          grep -q 'winkyou/internal/v2/fieldc1c\.loadRouter' "${RUNNER_TEMP}/router-symbols"
          go test -race -c -tags=natlab,c1bproof,fieldc1c -o "${RUNNER_TEMP}/router-proof.test" ./test/natlab
      - name: Three fresh exact-SHA endpoint plus real router instances
        run: |
          sudo env \
            WINKYOU_C1C_ROUTER_REQUIRED=1 \
            WINKYOU_FIELD_C1C_BINARY="${RUNNER_TEMP}/wink-field" \
            WINKYOU_C1C_ROUTER_BINARY="${RUNNER_TEMP}/c1crouter" \
            WINKYOU_C1B_SSHD_BINARY="$WINKYOU_C1B_SSHD_BINARY" \
            WINKYOU_GATE_B3_REQUIRED=1 \
            WINKYOU_GATE_B3_DISPOSABLE_RUNNER=github-hosted \
            GITHUB_ACTIONS=true \
            RUNNER_ENVIRONMENT=github-hosted \
            bash test/natlab/run_gate_b3_required_linux.sh \
            env GORACE=halt_on_error=1 \
            "${RUNNER_TEMP}/router-proof.test" \
            -test.v -test.run '^TestLinuxC1cRouterFullInstances$' -test.count=1 -test.timeout=7m
      - name: Kill owned worker and independently restore the explicit shared ceiling
        run: |
          sudo env \
            WINKYOU_C1C_ROUTER_REQUIRED=1 \
            WINKYOU_FIELD_C1C_BINARY="${RUNNER_TEMP}/wink-field" \
            WINKYOU_C1C_ROUTER_BINARY="${RUNNER_TEMP}/c1crouter" \
            WINKYOU_C1B_SSHD_BINARY="$WINKYOU_C1B_SSHD_BINARY" \
            WINKYOU_GATE_B3_REQUIRED=1 \
            WINKYOU_GATE_B3_DISPOSABLE_RUNNER=github-hosted \
            GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted \
            bash -c 'ulimit -n 65536; exec env GORACE=halt_on_error=1 "$1" -test.v -test.run "^TestLinuxC1cRouterGuardianCrash$" -test.count=1 -test.timeout=1m' \
            router-guardian-proof "${RUNNER_TEMP}/router-proof.test"
